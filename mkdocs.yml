site_name: LoongFlow
site_url: https://godeamon.github.io/LoongFlow/
site_description: A Cognitive Plan-Execute-Summarize Agent Framework
repo_name: godeamon/LoongFlow
repo_url: https://github.com/godeamon/LoongFlow
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2025 LoongFlow Team

# 主题配置
theme:
  name: material
  logo: assets/images/loongflow_fr_v1.jpg
  favicon: assets/images/loongflow_fr_v1.jpg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.indexes     # 允许点击目录标题
    - navigation.sections    # 侧边栏分块
    - navigation.expand      # 默认展开
    - navigation.top         # 返回顶部按钮
    - navigation.tracking    # URL 随滚动变化
    - toc.follow             # 目录随滚动高亮
    - content.code.copy      # 代码块复制按钮
    - content.action.edit    # 编辑此页
  palette:
    # 浅色模式
    - scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # 深色模式
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# 插件配置
plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: zh
          name: 简体中文
          build: true
      nav_translations:
        zh:
          Overview: 概览
          Quick Start: 快速开始
          Features & Guarantees: 特性与保障
          FAQ: 常见问题
          Performance: 性能
          Design: 设计
          Agents: 智能体
          General Evolve: 通用进化
          ML Evolve: 机器学习进化
          Build Agents: 构建智能体
          Get started: 准备工作
          Build your agent: 构建指南
          Components: 组件
          Reference: 参考手册

# Markdown 扩展
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - toc:
      permalink: true

# 版本管理
extra:
  version:
    provider: mike

# 新的导航结构
nav:
  # 注意：index.md 虽然没在这里显式列出，但它仍作为根路径存在。
  # 点击左上角 Logo 会跳转到 index.md，你可以将 index.md 内容改为重定向或项目介绍。
  - Overview:
      - Quick Start: overview/quickstart.md
      - Features & Guarantees: overview/features.md
      - FAQ: overview/faq.md
      - Performance: overview/performance.md
      - Design: overview/design.md
  - Agents:
      - General Evolve: agents/general_evolve.md
      - ML Evolve: agents/ml_evolve.md
  - Build Agents:
      - Get started: build/get_started.md
      - Build your agent: build/build_agent.md
  - Components:
      - components: components/components.md
  - Reference:
      - reference: reference/reference.md

extra_css:
  - assets/stylesheets/extra.css