name: Deploy Docs
on:
  push:
    branches:
      - main  # ⚠️ 如果你的主分支叫 master，请这里改成 master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - run: pip install mkdocs-material
      - run: mkdocs gh-deploy --force
